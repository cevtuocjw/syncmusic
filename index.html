<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CEVTUO-MSYNC · 一起听</title>
<meta name="theme-color" content="#070b0c">
<meta name="description" content="CEVTUO-MSYNC：Spotify 实时同听，朋友选择网易云音乐或 QQ 音乐后进入同步播放。">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#070b0c; --panel:#0d1415; --panel2:#111a1b; --line:#1d2b29;
    --ink:#e9f4f1; --dim:#8aa39e; --mute:#5c726e;
    --teal:#2dd4bf; --teal-soft:#5eead4;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    background:var(--bg);color:var(--ink);font:14px/1.7 var(--sans);
    padding:28px 18px 22px;
    background-image:radial-gradient(110% 70% at 50% -8%,#0f302c 0%,var(--bg) 62%);
  }
  .glow{position:fixed;left:50%;top:-18%;width:min(720px,120vw);height:420px;transform:translateX(-50%);
    background:radial-gradient(closest-side,rgba(45,212,191,.16),transparent 70%);pointer-events:none;z-index:0}
  main{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;
    background:linear-gradient(180deg,rgba(17,26,27,.96),rgba(10,17,18,.98));
    border:1px solid var(--line);border-radius:18px;padding:26px 22px 22px;
    box-shadow:0 30px 80px -36px #000}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:56px;height:56px;flex:none;filter:drop-shadow(0 6px 18px rgba(45,212,191,.16))}
  .eyebrow{font:600 9px/1 var(--mono);letter-spacing:.32em;color:var(--teal-soft);text-transform:uppercase}
  h1{font:500 22px/1.2 var(--mono);letter-spacing:.06em;margin:7px 0 0;text-transform:uppercase}
  h1 span{color:var(--teal)}
  .sub{color:var(--dim);font-size:12.5px;line-height:1.75;margin:16px 0 0}
  .q{margin-top:22px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:10px;
    padding:14px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);
    color:var(--ink);font-family:var(--sans);cursor:pointer;
    transition:border-color .2s,background .2s,transform .2s}
  .opt:hover{border-color:#2a534d;background:#142122;transform:translateY(-1px)}
  .opt.saved{border-color:#2a534d}
  .opt .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex:none;
    box-shadow:0 0 12px rgba(45,212,191,.55)}
  .opt .txt{flex:1;min-width:0}
  .opt b{display:block;font-size:14.5px;font-weight:600}
  .opt small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
  .opt .arrow{color:var(--mute);flex:none;font-size:16px}
  .opt:hover .arrow{color:var(--teal-soft)}
  .hint{font-size:11.5px;color:var(--mute);text-align:center;margin:14px 0 0;min-height:16px}
  .hint.bad{color:#d08a5a}
  .keybox{display:flex;gap:8px;margin-top:12px}
  .keybox[hidden]{display:none}
  .keybox input{flex:1;min-width:0;background:#0a1011;border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:10px 12px;font:12px var(--sans)}
  .keybox input:focus{outline:none;border-color:#2a534d}
  .keybox button{border:0;background:var(--teal);color:#04110f;font-weight:700;border-radius:9px;
    padding:0 16px;cursor:pointer;font-family:var(--sans)}
  .direct{display:block;text-align:center;margin-top:12px;padding-top:12px;border-top:1px solid #16211f;
    font-size:11.5px;color:var(--dim);text-decoration:none}
  .direct:hover{color:var(--teal-soft)}
  .direct[hidden]{display:none}
  footer{position:relative;z-index:1;text-align:center;color:var(--mute);
    font:9px/1.6 var(--mono);letter-spacing:.22em;text-transform:uppercase;margin-top:20px}
  @media (max-width:380px){h1{font-size:19px}.brand img{width:48px;height:48px}}
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <div class="brand">
    <img src="logo.svg" alt="CEVTUO">
    <div>
      <div class="eyebrow">CEVTUO</div>
      <h1>CEVTUO<span>-</span>MSYNC</h1>
    </div>
  </div>

  <p class="sub">Spotify → 网易云 / QQ 音乐<br>实时同听 · 进度同步</p>

  <div class="q">先选你平时用的音乐服务</div>
  <button class="opt" data-p="netease"><span class="dot"></span><span class="txt"><b>网易云音乐</b><small>会员曲扫码登录自己的账号</small></span><span class="arrow">→</span></button>
  <button class="opt" data-p="qq"><span class="dot"></span><span class="txt"><b>QQ 音乐</b><small>手机上自动跳 App 打开；回来同步</small></span><span class="arrow">→</span></button>

  <p class="hint" id="hint">选择后进入播放页。</p>
  <div class="keybox" id="keybox" hidden>
    <input id="keyinput" placeholder="粘贴房主给你的完整链接，或只填 k=…" autocomplete="off">
    <button id="keygo">进入</button>
  </div>
  <a class="direct" id="direct" href="#" hidden>播放页打不开？点这里走大陆直连 →</a>
</main>
<footer>CEVTUO · MSYNC <br>SYNC LISTENING</footer>

<script>
  const qs = new URLSearchParams(location.search);
  const k = (qs.get('k') || '').trim();
  const APP = 'http://120.77.27.128:8081/listen?k=';
  const hint = document.getElementById('hint');
  const direct = document.getElementById('direct');

  if (k) {
    direct.href = APP + encodeURIComponent(k);
    direct.hidden = false;
  } else {
    hint.textContent = '这个地址缺少朋友密钥；粘贴房主给你的链接，或直接填 k。';
    hint.classList.add('bad');
    const keybox = document.getElementById('keybox');
    const keyinput = document.getElementById('keyinput');
    keybox.hidden = false;
    const applyKey = () => {
      let v = keyinput.value.trim();
      if (!v) return;
      const m = v.match(/[?&]k=([^&#\s]+)/);
      if (m) v = decodeURIComponent(m[1]);
      if (!v) {
        hint.textContent = '没有识别到 k，请粘贴完整的朋友链接。';
        return;
      }
      location.replace('?k=' + encodeURIComponent(v));
    };
    document.getElementById('keygo').onclick = applyKey;
    keyinput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyKey(); });
  }

  document.querySelectorAll('.opt').forEach((b) => {
    if (localStorage.getItem('ms_platform') === b.dataset.p) b.classList.add('saved');
    b.onclick = () => {
      if (!k) {
        hint.textContent = '需要房主给你的链接（带 ?k=）。';
        hint.classList.add('bad');
        return;
      }
      localStorage.setItem('ms_platform', b.dataset.p);
      hint.classList.remove('bad');
      hint.textContent = '正在进入…';
      location.replace(APP + encodeURIComponent(k) + '&platform=' + encodeURIComponent(b.dataset.p));
    };
  });
</script>
</body>
</html>
